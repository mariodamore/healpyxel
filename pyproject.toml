[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "healpyxel"
dynamic = ["version"]
description = "HEALPix-based spatial aggregation for planetary science data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Mario D'Amore", email = "mario.damore@dlr.de"}]
keywords = ['healpix', 'planetary-science', 'spatial-aggregation', 'streaming']
classifiers = ["Natural Language :: English", "Intended Audience :: Science/Research", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['pandas>=2.0', 'numpy>=1.24', 'pyarrow>=12.0', 'shapely>=2.0', 'healpy>=1.16', 'dask-geopandas>=0.3', 'antimeridian', 'tqdm', 'duckdb>=0.9.0', 'rich>=13.0']

[project.urls]
Repository = "https://github.com/mariodamore/healpyxel"
Documentation = "https://mariodamore.github.io/healpyxel/"


[project.optional-dependencies]
dev = ['jupyter', 'jupytext', 'quartodoc>=0.7.0', 'griffe<2.0.0']

[tool.setuptools.dynamic]
version = {attr = "healpyxel.__version__"}

[tool.setuptools.packages.find]
include = ["healpyxel"]

[tool.setuptools.package-data]
healpyxel = ["py.typed"]

[project.scripts]
healpyxel_sidecar = "healpyxel.cli:sidecar_cli"
healpyxel_aggregate = "healpyxel.cli:aggregate_cli"
healpyxel_accumulator = "healpyxel.cli:accumulator_cli"
healpyxel_finalize = "healpyxel.cli:finalize_cli"
healpyxel_to_geoparquet = "healpyxel.cli:to_geoparquet_cli"
healpyxel_cache = "healpyxel.cli:cache_cli"
