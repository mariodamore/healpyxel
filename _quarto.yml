project:
  type: website
  title: "Healpyxel"
  output-dir: docs
  render:
    - docs_src/index.qmd
    - docs_src/reference/index.qmd
    - notebooks/01_core_concepts.py
    - notebooks/02_full_workflow.py
    - notebooks/82_example_visualization_psf.py
    - notebooks/03_sphere_native_sidecar.py
    - notebooks/90_example_streaming.py
    - notebooks/91_example_inspect.py

website:
  navbar:
    title: "Healpyxel"
    logo: docs_src/logo_cutout_128.png
    search: true
    pinned: true
    left:
      - text: "Home"
        href: docs_src/index.qmd
      - text: "Tutorials"
        href: notebooks/01_core_concepts.py.html
      - text: "Sphere-Native Sidecar"
        href: notebooks/03_sphere_native_sidecar.py.html
      - text: "Reference"
        href: docs_src/reference/index.qmd
  favicon: docs_src/favicon.ico
  sidebar:
    style: docked
    search: true
    collapse-level: 2
    contents:
      - section: "Home"
        contents:
          - docs_src/index.qmd
      - section: "Tutorials"
        contents:
          - notebooks/01_core_concepts.py
          - notebooks/02_full_workflow.py
          - section: "Visualization"
            contents:
              - notebooks/82_example_visualization_psf.py
          - section: "Geometry Engine"
            contents:
              - notebooks/03_sphere_native_sidecar.py
          - section: "Streaming"
            contents:
              - notebooks/90_example_streaming.py
          - section: "Inspection"
            contents:
              - notebooks/91_example_inspect.py
      - section: "API Reference"
        contents:
          - docs_src/reference/index.qmd
          - section: "Core"
            contents:
              - docs_src/reference/core.validate_nside
              - docs_src/reference/core.mad
              - docs_src/reference/core.robust_std
              - docs_src/reference/core.setup_logger
          - section: "Sidecar"
            contents:
              - docs_src/reference/sidecar.compute_healpix_ids_from_lonlat
              - docs_src/reference/sidecar.detect_lonlat_columns
              - docs_src/reference/sidecar.process_partition
              - docs_src/reference/sidecar.add_psf_weights_to_sidecar
              - docs_src/reference/sidecar.normalize_weights_per_cell
              - docs_src/reference/sidecar.build_output_path
              - docs_src/reference/sidecar.write_sidecar_metadata
              - docs_src/reference/sidecar.validate_nside
              - docs_src/reference/sidecar.get_healpix_cell_geometry
              - docs_src/reference/sidecar.get_psf
              - docs_src/reference/sidecar.GaussianPSF
          - section: "Aggregate"
            contents:
              - docs_src/reference/aggregate.aggregate_by_sidecar
              - docs_src/reference/aggregate.collect_sidecar_outputs
              - docs_src/reference/aggregate.densify_healpix_aggregates
              - docs_src/reference/aggregate.generate_output_filename
              - docs_src/reference/aggregate.extract_nside_from_filename
              - docs_src/reference/aggregate.validate_sidecar_metadata
              - docs_src/reference/aggregate.process_single_sidecar
          - section: "Accumulator"
            contents:
              - docs_src/reference/accumulator.StreamingStats
              - docs_src/reference/accumulator.CellAccumulator
              - docs_src/reference/accumulator.accumulate_batch
              - docs_src/reference/accumulator.save_state
              - docs_src/reference/accumulator.load_state
              - docs_src/reference/accumulator.state_to_dataframe
              - docs_src/reference/accumulator.validate_accumulator_sidecar_compatibility
              - docs_src/reference/accumulator.find_sidecar
              - docs_src/reference/accumulator.ensure_not_processed
          - section: "Finalize"
            contents:
              - docs_src/reference/finalize.finalize_statistics
              - docs_src/reference/finalize.densify_healpix_map
              - docs_src/reference/finalize.export_to_geotiff
              - docs_src/reference/finalize.load_state
          - section: "Metadata"
            contents:
              - docs_src/reference/metadata.HEALPyxelxMetadata
              - docs_src/reference/metadata.FileType
              - docs_src/reference/metadata.read_metadata_from_file
              - docs_src/reference/metadata.save_with_metadata
              - docs_src/reference/metadata.validate_sidecar
              - docs_src/reference/metadata.validate_aggregate
          - section: "CLI"
            contents:
              - docs_src/reference/cli.sidecar_cli
              - docs_src/reference/cli.aggregate_cli
              - docs_src/reference/cli.accumulator_cli
              - docs_src/reference/cli.finalize_cli
              - docs_src/reference/cli.to_geoparquet_cli
              - docs_src/reference/cli.cache_cli
              - docs_src/reference/cli.inspect_cli
              - docs_src/reference/cli.validate_lon_lat_columns
  reader-mode: true
  page-navigation: true
  back-to-top-navigation: true

format:
  html:
    theme:
      light: flatly
      dark: darkly
    respect-user-color-scheme: true
    toc: true
    code-fold: true
    code-tools: true
    codefold: true
    max-width: 2200px
    # css:
    #   # custom CSS overrides
    #   - docs_src/reference/custom.css
execute:
  echo: true
  warning: false
  error: false

jupyter:
  kernelspec:
    name: python3
    display_name: Python 3
    language: python
  notebook-dir: notebooks

quartodoc:
  package: healpyxel
  dir: docs_src/reference
  sections:
    - title: Core
      desc: Validation, robust statistics, and logging utilities.
      contents:
        - core.healpix_cell_sizes
        - core.validate_nside
        - core.mad
        - core.robust_std
        - core.setup_logger
    - title: Sidecar
      desc: HEALPix sidecar generation and PSF-weighted assignment.
      contents:
        - sidecar.compute_healpix_ids_from_lonlat
        - sidecar.detect_lonlat_columns
        - sidecar.process_partition
        - sidecar.add_psf_weights_to_sidecar
        - sidecar.normalize_weights_per_cell
        - sidecar.build_output_path
        - sidecar.write_sidecar_metadata
        - sidecar.validate_nside
        - sidecar.get_healpix_cell_geometry
        - sidecar.get_psf
        - sidecar.GaussianPSF
    - title: Aggregate
      desc: Sidecar aggregation and output generation.
      contents:
        - aggregate.aggregate_by_sidecar
        - aggregate.collect_sidecar_outputs
        - aggregate.densify_healpix_aggregates
        - aggregate.generate_output_filename
        - aggregate.extract_nside_from_filename
        - aggregate.validate_sidecar_metadata
        - aggregate.process_single_sidecar
    - title: Accumulator
      desc: Streaming accumulation with TDigest percentiles.
      contents:
        - accumulator.StreamingStats
        - accumulator.CellAccumulator
        - accumulator.accumulate_batch
        - accumulator.save_state
        - accumulator.load_state
        - accumulator.state_to_dataframe
        - accumulator.validate_accumulator_sidecar_compatibility
        - accumulator.find_sidecar
        - accumulator.ensure_not_processed
    - title: Finalize
      desc: Statistics finalization and export.
      contents:
        - finalize.finalize_statistics
        - finalize.densify_healpix_map
        - finalize.export_to_geotiff
        - finalize.load_state
    - title: Metadata
      desc: HEALPyxelxMetadata embedding and validation.
      contents:
        - metadata.HEALPyxelxMetadata
        - metadata.FileType
        - metadata.read_metadata_from_file
        - metadata.save_with_metadata
        - metadata.validate_sidecar
        - metadata.validate_aggregate
    - title: CLI
      desc: Command-line interface entry points.
      contents:
        - cli.sidecar_cli
        - cli.aggregate_cli
        - cli.accumulator_cli
        - cli.finalize_cli
        - cli.to_geoparquet_cli
        - cli.cache_cli
        - cli.inspect_cli
        - cli.validate_lon_lat_columns
