project:
  type: website

format:
  html:
    logo: logo_cutout_128.png
    theme: 
      dark: darkly
      light: cosmo
    css: styles.css
    toc: true
    keep-md: true
    page-layout: full
    grid:
      body-width : 1200px
      sidebar-width: 250px
      margin-width: 200px
  commonmark: default

website:
  favicon : favicon.ico
  twitter-card: true
  open-graph: true
  repo-actions: [issue]
  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        href: index.html
      - text: "Quickstart"
        href: example_quickstart.html
    tools:
      - icon: github
        menu:
          - text: Source Code
            href: https://github.com/mariodamore/healpyxel/
          - text: Report a Bug
            href: https://github.com/mariodamore/healpyxel/issues/new
  sidebar:
    style: floating
    logo: logo_cutout_128.png
    collapse-level: 1
    contents:
      - index.ipynb
      # - 00_core.ipynb
      - section: Core Concepts
        contents:
        - 00_setup.ipynb
        - 01_sidecar.ipynb
        - 02_aggregate.ipynb
        - 03_accumulator.ipynb
        - 04_finalize.ipynb
        - 05_cli.ipynb
        - 06_visualization.ipynb
      - section: Examples
        contents:
          - 80_example_quickstart.ipynb
          - 81_example_visualization_workflow.ipynb
          - 82_example_visualization_psf.ipynb
          - 83_example_accumulation.ipynb
          - 90_example_streaming.ipynb

metadata-files: [nbdev.yml]
