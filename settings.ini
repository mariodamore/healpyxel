[DEFAULT]
# Project metadata
lib_name = healpyxel
repo = healpyxel
user = mariodamore
description = HEALPix-based spatial aggregation for planetary science data
keywords = healpix planetary-science spatial-aggregation streaming
author = Mario D'Amore
author_email = mario.damore@dlr.de
copyright = 2025 onwards, Mario D'Amore
branch = main
version = 0.1.0
min_python = 3.10
audience = Science/Research
language = English

# PyPI requirements
requirements = pandas>=2.0 numpy>=1.24 pyarrow>=12.0 shapely>=2.0 healpy>=1.16 dask-geopandas>=0.3 antimeridian tqdm
dev_requirements = nbdev>=2.3.12 jupyter

# nbdev configuration
nbs_path = nbs
lib_path = healpyxel
doc_path = docs
tst_flags = notest
recursive = True
black_formatting = False
readme_nb = index.ipynb
allowed_metadata_keys = 
allowed_cell_metadata_keys = 
jupyter_hooks = True
clean_ids = True
clear_all = False
doc_nbs = index 00_setup 00_core 05_cli 90_example_streaming

# Documentation
title = Healpyxel
custom_sidebar = False
license = apache2
status = 3

# Git/GitHub
git_url = https://github.com/%(user)s/%(lib_name)s
host = github
